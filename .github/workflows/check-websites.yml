name: Check Websites

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trigger-website-checks:
    name: Trigger Supabase website checks
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Call check-websites Edge Function
        shell: bash
        env:
          SUPABASE_FUNCTION_URL: ${{ secrets.SUPABASE_FUNCTION_URL }}
          MONITORING_CRON_SECRET: ${{ secrets.MONITORING_CRON_SECRET }}
        run: |
          set -euo pipefail

          if [ -z "${SUPABASE_FUNCTION_URL}" ]; then
            echo "SUPABASE_FUNCTION_URL secret is not configured."
            exit 1
          fi

          if [ -z "${MONITORING_CRON_SECRET}" ]; then
            echo "MONITORING_CRON_SECRET secret is not configured."
            exit 1
          fi

          response_file="$(mktemp)"
          status_code="$(
            curl --silent --show-error --location \
              --request POST "${SUPABASE_FUNCTION_URL}" \
              --header "Authorization: Bearer ${MONITORING_CRON_SECRET}" \
              --header "x-monitoring-secret: ${MONITORING_CRON_SECRET}" \
              --header "Content-Type: application/json" \
              --data '{"limit":25}' \
              --output "${response_file}" \
              --write-out "%{http_code}"
          )"

          cat "${response_file}"
          echo

          if [ "${status_code}" -lt 200 ] || [ "${status_code}" -gt 299 ]; then
            echo "check-websites returned HTTP ${status_code}."
            exit 1
          fi
